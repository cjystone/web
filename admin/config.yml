backend:
  name: github
  repo: cjystone/web
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # 1. 平台架构与前端安全控制 (对应方案：屏蔽大陆IP、防复制代码等)
  # ==========================================
  - name: "system_architecture"
    label: "🛡️ 平台架构与安全设置"
    delete: false
    files:
      - name: "security"
        label: "安全与前端防御设置"
        file: "content/settings/security.json"
        fields:
          - label: "屏蔽中国大陆 IP 访问"
            name: "block_china_ip"
            widget: "boolean"
            default: false
            hint: "开启后，通过前端 Cloudflare 节点自动重定向或拦截国内 IP"
          - label: "禁止右键复制与防同行扒图"
            name: "prevent_copy"
            widget: "boolean"
            default: true
            hint: "禁用右键菜单、划词复制与拖拽另存图片"
          - label: "全站响应式自动适配"
            name: "responsive_enabled"
            widget: "boolean"
            default: true
          - label: "HTML 纯静态预渲染模式"
            name: "ssg_mode"
            widget: "boolean"
            default: true

  # ==========================================
  # 2. 网站基本信息与视觉设计 (Logo、Icon、Banner)
  # ==========================================
  - name: "site_design_config"
    label: "🎨 网站信息与视觉设计"
    delete: false
    files:
      - name: "base_info"
        label: "基本信息与 ICON"
        file: "content/settings/base_info.json"
        fields:
          - {label: "网站主标题", name: "site_title", widget: "string"}
          - {label: "企业全称", name: "company_name", widget: "string"}
          - {label: "网站主 Logo", name: "logo", widget: "image"}
          - {label: "网站 Favicon 图标", name: "favicon", widget: "image"}
          - {label: "企业版权声明", name: "copyright", widget: "string", default: "© 2026 All Rights Reserved."}

      - name: "banners"
        label: "首页 Banner 横幅设计 (支持三张轮播)"
        file: "content/settings/banners.json"
        fields:
          - label: "横幅轮播列表"
            name: "banner_list"
            widget: "list"
            fields:
              - {label: "横幅背景大图", name: "image", widget: "image"}
              - {label: "主标语 (Hero Title)", name: "title", widget: "string"}
              - {label: "副标语 (Subtitle)", name: "subtitle", widget: "string"}
              - {label: "按钮文字", name: "btn_text", widget: "string", default: "Inquire Now"}
              - {label: "按钮跳转链接", name: "btn_link", widget: "string", default: "#contact"}

  # ==========================================
  # 3. 产品分类与产品管理 (批发模式、包装体积重量、多图、标签)
  # ==========================================
  - name: "product_categories"
    label: "📂 产品类别设置"
    delete: false
    files:
      - name: "categories"
        label: "管理产品分类"
        file: "content/settings/product_categories.json"
        fields:
          - label: "产品分类列表"
            name: "list"
            widget: "list"
            fields:
              - {label: "分类名称 (英文)", name: "name", widget: "string"}
              - {label: "分类别名 (Slug)", name: "slug", widget: "string"}
              - {label: "分类封面图", name: "cover", widget: "image", required: false}

  - name: "products"
    label: "📦 产品管理 (含批发与包装)"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "产品标题 (Title)", name: "title", widget: "string"}
      - {label: "所属类别标识 (Category)", name: "category", widget: "string"}
      - {label: "产品型号 (SKU / Model)", name: "model", widget: "string"}
      - {label: "开启产品批发模式 (Wholesale)", name: "is_wholesale", widget: "boolean", default: true}
      - {label: "最低起订量与阶梯报价 (MOQ & Price)", name: "price_moq", widget: "string", default: "MOQ: 500 pcs | $2.50 - $3.80"}
      - {label: "包装单重 (Gross Weight / 单件重量)", name: "weight", widget: "string", default: "420g"}
      - {label: "装箱体积与外箱尺寸 (Carton Volume / CBM)", name: "cbm", widget: "string", default: "50 pcs/ctn, 0.08 CBM"}
      - {label: "产品标签 (Tags 分类管理)", name: "tags", widget: "list", field: {label: "标签名", name: "tag", widget: "string"}}
      - {label: "产品主图 (Featured Image)", name: "image", widget: "image"}
      - label: "产品多图展示图集 (Gallery)"
        name: "gallery"
        widget: "list"
        required: false
        field: {label: "细节图片", name: "image", widget: "image"}
      - {label: "材质规格与工艺参数 (Specifications)", name: "specs", widget: "text"}
      - {label: "产品详细介绍 (Description)", name: "body", widget: "markdown"}

  # ==========================================
  # 4. 文章管理 (定时发布、社交分享)
  # ==========================================
  - name: "articles"
    label: "📝 文章与新闻管理"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期 / 定时发布", name: "date", widget: "datetime"}
      - {label: "封面配图", name: "cover", widget: "image"}
      - {label: "开启社交分享栏 (Twitter/FB/微信/LinkedIn)", name: "social_share", widget: "boolean", default: true}
      - {label: "文章简述 (Summary)", name: "summary", widget: "text"}
      - {label: "文章正文", name: "body", widget: "markdown"}

  # ==========================================
  # 5. 表单与询盘管理 (邮件/短信/智能分配)
  # ==========================================
  - name: "inquiry_system"
    label: "📬 表单与询盘管理"
    delete: false
    files:
      - name: "inquiry_routing"
        label: "询盘流转与通知规则"
        file: "content/settings/inquiry_rules.json"
        fields:
          - {label: "Formspree 询盘接收端点", name: "formspree_url", widget: "string", default: "https://formspree.io/f/xkjodygl"}
          - {label: "询盘邮件提醒地址 (转发工作邮箱)", name: "notify_email", widget: "string", default: "cjystone@126.com"}
          - {label: "询盘手机短信/微信提醒号码", name: "notify_phone", widget: "string", default: "13030882085"}
          - label: "询盘智能分配规则 (按分类分配业务员)"
            name: "routing_rules"
            widget: "list"
            fields:
              - {label: "负责产品类别 (Category)", name: "category", widget: "string"}
              - {label: "指派业务员邮箱", name: "assigned_sales", widget: "string"}

  # ==========================================
  # 6. 在线客服与社交沟通 (WhatsApp、Skype、电话、短信、二维码)
  # ==========================================
  - name: "customer_service"
    label: "💬 在线客服与沟通系统"
    delete: false
    files:
      - name: "contact_channels"
        label: "客服多渠道配置"
        file: "content/settings/channels.json"
        fields:
          - {label: "在线 WhatsApp 号码 (含国标，如 +8613030882085)", name: "whatsapp", widget: "string", default: "+8613030882085"}
          - {label: "在线 Skype 账号", name: "skype", widget: "string", required: false}
          - {label: "手机直接拨打热线 (Phone)", name: "tel", widget: "string", default: "13030882085"}
          - {label: "手机端在线短信发送号码", name: "sms_number", widget: "string", default: "13030882085"}
          - {label: "官方微信二维码图片", name: "wechat_qr", widget: "image", required: false}

  # ==========================================
  # 7. 资料库、图册与 FAQ 系统 (文档下载、电子画册、问答)
  # ==========================================
  - name: "knowledge_and_assets"
    label: "📚 资料库、画册与FAQ"
    delete: false
    files:
      - name: "download_center"
        label: "资料库与图册下载系统"
        file: "content/settings/downloads.json"
        fields:
          - label: "公开技术画册 / PDF 资料下载列表"
            name: "download_list"
            widget: "list"
            fields:
              - {label: "资料/画册名称", name: "title", widget: "string"}
              - {label: "文件上传 (PDF/ZIP)", name: "file", widget: "file"}
              - {label: "画册封面预览图", name: "cover", widget: "image", required: false}

      - name: "faq_system"
        label: "FAQ 常见问答系统 (抓取 Google 摘要)"
        file: "content/settings/faq.json"
        fields:
          - label: "问答条目列表"
            name: "faq_list"
            widget: "list"
            fields:
              - {label: "采购常见问题 (Question)", name: "q", widget: "string"}
              - {label: "官方标准解答 (Answer)", name: "a", widget: "text"}

  # ==========================================
  # 8. SEO、SMO 社交分享与重定向配置
  # ==========================================
  - name: "seo_smo_config"
    label: "🚀 SEO与SMO社交营销配置"
    delete: false
    files:
      - name: "seo_rules"
        label: "自动化 SEO 推广与收录设置"
        file: "content/settings/seo.json"
        fields:
          - {label: "全站自动生成 Schema.org 结构化数据", name: "auto_schema", widget: "boolean", default: true}
          - {label: "开启面包屑导航 (Breadcrumbs)", name: "breadcrumbs", widget: "boolean", default: true}
          - {label: "百度/Google 站长验证代码", name: "verification_code", widget: "string", default: "codeva-ruEmng8Nng"}
          - {label: "全站核心 SEO 关键词 (Meta Keywords)", name: "keywords", widget: "string"}
          - {label: "全站核心 SEO 描述 (Meta Description)", name: "description", widget: "text"}

      - name: "redirects"
        label: "页面 / URL 301 重定向管理"
        file: "content/settings/redirects.json"
        fields:
          - label: "重定向列表"
            name: "rules"
            widget: "list"
            fields:
              - {label: "原旧网页地址 (Old URL)", name: "from", widget: "string"}
              - {label: "跳转目标新地址 (New URL)", name: "to", widget: "string"}

  # ==========================================
  # 9. 营销系统与运营罗盘 (关键词助手、统计代码)
  # ==========================================
  - name: "marketing_compass"
    label: "🧭 营销系统与运营罗盘"
    delete: false
    files:
      - name: "compass"
        label: "营销统计与追踪代码"
        file: "content/settings/marketing.json"
        fields:
          - {label: "Google Analytics 统计代码 (G-XXXXXX)", name: "ga_id", widget: "string", required: false}
          - {label: "百度统计代码", name: "baidu_analytics_id", widget: "string", required: false}
          - {label: "目标重点监控排名关键词 (关键词助手)", name: "target_keywords", widget: "list", field: {label: "核心词", name: "keyword", widget: "string"}}

  # ==========================================
  # 10. 会员系统与多账号权限控制
  # ==========================================
  - name: "member_and_access"
    label: "👥 会员与多账号权限控制"
    delete: false
    files:
      - name: "access_control"
        label: "页面访问密码与权限控制"
        file: "content/settings/access.json"
        fields:
          - {label: "开启全站访客密码保护", name: "enable_password_gate", widget: "boolean", default: false}
          - {label: "访客独立访问密码", name: "visitor_password", widget: "string", default: "888888"}
          - label: "子账号管理 (对应 5 个分级权限管理)"
            name: "sub_accounts"
            widget: "list"
            fields:
              - {label: "子账号名称 (邮箱或手机)", name: "username", widget: "string"}
              - {label: "初始登录密码", name: "initial_pass", widget: "string", default: "123456"}
              - {label: "分配权限角色", name: "role", widget: "select", options: ["超级管理员", "产品专员", "文章编辑", "询盘接待员"]}
