backend:
  name: github
  repo: user/repo
media_folder: "assets/images"
public_folder: "/assets/images"
collections:
  - name: "posts"
    label: "Post"
    folder: "_posts"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
