backend:
  name: github
  repo: cjystone/web
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # 1. 网站配置管理
  # ==========================================
  - name: "site_settings"
    label: "⚙️ 网站配置管理"
    delete: false
    files:
      # 网站基本信息配置
      - name: "general"
        label: "网站基本信息配置"
        file: "content/settings/general.json"
        fields:
          - {label: "网站标题 (Site Title)", name: "site_title", widget: "string"}
          - {label: "企业全称 (Company Legal Name)", name: "company_name", widget: "string"}
          - {label: "网站域名 (Website URL)", name: "site_url", widget: "string", default: "https://www.fjwmkc.com"}
          - {label: "网站 Logo", name: "logo", widget: "image"}
          - {label: "Favicon 浏览器图标", name: "favicon", widget: "image"}
          - {label: "全球 SEO 核心关键词 (Meta Keywords)", name: "meta_keywords", widget: "string"}
          - {label: "全球 SEO 网站描述 (Meta Description)", name: "meta_description", widget: "text"}
          - {label: "版权信息 (Copyright)", name: "copyright", widget: "string", default: "© 2026 All Rights Reserved."}

      # 网站栏目设置
      - name: "navigation"
        label: "网站栏目设置"
        file: "content/settings/navigation.json"
        fields:
          - label: "主导航菜单 (Navigation Menu)"
            name: "menu_items"
            widget: "list"
            fields:
              - {label: "栏目名称 (Label)", name: "label", widget: "string"}
              - {label: "链接地址 (URL/Anchor)", name: "url", widget: "string"}

      # 个性化设置 (主题色、询盘配置、统计代码)
      - name: "customization"
        label: "个性化设置"
        file: "content/settings/customization.json"
        fields:
          - {label: "主题主色调 (Brand Primary Color)", name: "primary_color", widget: "color", default: "#1b4d3e"}
          - {label: "辅助强调色 (Accent Color)", name: "accent_color", widget: "color", default: "#e67e22"}
          - {label: "询盘接收接口 (Formspree Endpoint)", name: "formspree_url", widget: "string", default: "https://formspree.io/f/xkjodygl"}
          - {label: "WhatsApp 浮动客服号码 (含国标，如 +86138...)", name: "whatsapp_number", widget: "string", required: false}
          - {label: "Google Analytics 追踪代码 (如 G-XXXXXXX)", name: "ga_id", widget: "string", required: false}

      # 网站Banner图
      - name: "banners"
        label: "网站Banner图"
        file: "content/settings/banners.json"
        fields:
          - label: "首屏横幅轮播列表 (Hero Banners)"
            name: "banner_list"
            widget: "list"
            fields:
              - {label: "Banner 背景大图", name: "image", widget: "image"}
              - {label: "主标语 (Hero Title)", name: "title", widget: "string"}
              - {label: "副标语 (Hero Subtitle)", name: "subtitle", widget: "string"}
              - {label: "行动按钮文字 (Button Text)", name: "btn_text", widget: "string", default: "Contact Us"}
              - {label: "按钮跳转链接 (Button URL)", name: "btn_link", widget: "string", default: "#contact"}

      # 关于我们 - 联系信息 / 工厂实力
      - name: "about_us"
        label: "关于我们 - 工厂实力"
        file: "content/settings/about.json"
        fields:
          - {label: "工厂/企业介绍 (About Summary)", name: "about_text", widget: "markdown"}
          - {label: "工厂占地面积 (㎡)", name: "factory_area", widget: "string", default: "45,000 m²"}
          - {label: "年产能 (Annual Output)", name: "capacity", widget: "string", default: "60,000,000 Pcs"}
          - {label: "全球出口国家数", name: "countries", widget: "string", default: "80+ Countries"}
          - {label: "全检质检率", name: "inspection_rate", widget: "string", default: "100% Inspection"}
          - {label: "工厂与生产线实拍图", name: "factory_images", widget: "list", field: {label: "图片", widget: "image"}}

      # 联系我们 (联系方式与企业坐标)
      - name: "contact_info"
        label: "联系我们"
        file: "content/settings/contact.json"
        fields:
          - {label: "外贸官方联系邮箱 (Sales Email)", name: "email", widget: "string"}
          - {label: "对外业务电话 (Phone / Tel)", name: "phone", widget: "string"}
          - {label: "工厂与企业物理地址 (Factory Address)", name: "address", widget: "string"}
          - {label: "工作时间 (Working Hours)", name: "hours", widget: "string", default: "Mon - Sat: 8:30 - 18:00 (GMT+8)"}

      # 网站其他图片管理 (认证证书、合作伙伴Logo等)
      - name: "media_assets"
        label: "网站其他图片管理"
        file: "content/settings/media_assets.json"
        fields:
          - label: "资质与认证证书 (Certifications: ISO, FDA, BSCI等)"
            name: "cert_images"
            widget: "list"
            fields:
              - {label: "证书名称", name: "cert_name", widget: "string"}
              - {label: "证书扫描件", name: "image", widget: "image"}
          - label: "合作品牌 / 客户 Logo"
            name: "partner_logos"
            widget: "list"
            field: {label: "Logo 图标", widget: "image"}

  # ==========================================
  # 2. 产品分类 (Product Categories)
  # ==========================================
  - name: "product_categories"
    label: "📂 产品类别"
    file: "content/settings/product_categories.json"
    fields:
      - label: "产品分类列表"
        name: "categories"
        widget: "list"
        fields:
          - {label: "分类英文名称", name: "name", widget: "string"}
          - {label: "分类标识/Slug (如 tumblers, titanium)", name: "slug", widget: "string"}
          - {label: "分类封面图", name: "cover", widget: "image", required: false}

  # ==========================================
  # 3. 产品 (Products)
  # ==========================================
  - name: "products"
    label: "📦 产品"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "产品标题 (Product Title)", name: "title", widget: "string"}
      - {label: "所属类别标识 (Category Slug)", name: "category", widget: "string"}
      - {label: "产品型号 (Model / SKU)", name: "model", widget: "string"}
      - {label: "产品主图 (Featured Image)", name: "image", widget: "image"}
      - {label: "产品图集 (Gallery Images)", name: "gallery", widget: "list", field: {label: "图片", widget: "image"}, required: false}
      - {label: "最低起订量 / 阶梯价格 (MOQ / Price)", name: "price_moq", widget: "string", default: "MOQ: 500 pcs | $2.50 - $3.80"}
      - {label: "材质规格与工艺 (Specifications)", name: "specs", widget: "text"}
      - {label: "真空与保温性能 (Thermal Performance)", name: "thermal", widget: "string", default: "Hot 24 Hours / Cold 48 Hours"}
      - {label: "产品详细描述 (Detailed Description)", name: "body", widget: "markdown"}

  # ==========================================
  # 4. 新闻类别 (News Categories)
  # ==========================================
  - name: "news_categories"
    label: "📂 新闻类别"
    file: "content/settings/news_categories.json"
    fields:
      - label: "新闻分类列表"
        name: "categories"
        widget: "list"
        fields:
          - {label: "分类名称 (如 Company News, Exhibitions)", name: "name", widget: "string"}
          - {label: "分类标识 (Slug)", name: "slug", widget: "string"}

  # ==========================================
  # 5. 新闻 (News)
  # ==========================================
  - name: "news"
    label: "📰 新闻"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "新闻标题 (Article Title)", name: "title", widget: "string"}
      - {label: "所属分类 (Category)", name: "category", widget: "string"}
      - {label: "发布日期 (Publish Date)", name: "date", widget: "datetime"}
      - {label: "新闻封面图 (Cover Image)", name: "cover", widget: "image"}
      - {label: "简要摘要 (Summary)", name: "summary", widget: "text"}
      - {label: "文章正文 (Article Body)", name: "body", widget: "markdown"}

  # ==========================================
  # 6. 行业知识类别 (Knowledge Categories)
  # ==========================================
  - name: "knowledge_categories"
    label: "📂 行业知识类别"
    file: "content/settings/knowledge_categories.json"
    fields:
      - label: "行业知识分类列表"
        name: "categories"
        widget: "list"
        fields:
          - {label: "分类名称 (如 Material Guides, Testing Standards)", name: "name", widget: "string"}
          - {label: "分类标识 (Slug)", name: "slug", widget: "string"}

  # ==========================================
  # 7. 行业知识 / 白皮书 (Knowledge / Glossary)
  # ==========================================
  - name: "knowledge"
    label: "💡 行业知识"
    folder: "content/knowledge"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "知识库标题 (Topic Title)", name: "title", widget: "string"}
      - {label: "所属知识类别 (Category)", name: "category", widget: "string"}
      - {label: "技术图解 / 结构图", name: "image", widget: "image", required: false}
      - {label: "工程白皮书 / 核心内容 (Technical Content)", name: "body", widget: "markdown"}
