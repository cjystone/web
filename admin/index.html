<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站管理后台 - 账号登录</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8fafc;
    }
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
    }
    .auth-card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
    }
    .auth-card h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #0f172a;
      text-align: center;
    }
    .auth-card p {
      margin: 0 0 24px 0;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .form-group input:focus {
      border-color: #1b4d3e;
      box-shadow: 0 0 0 2px rgba(27,77,62,0.2);
    }
    .btn-login {
      width: 100%;
      padding: 11px;
      background: #1b4d3e;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #143a2f;
    }
    .sub-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12px;
    }
    .sub-actions a {
      color: #2563eb;
      text-decoration: none;
      cursor: pointer;
    }
    .sub-actions a:hover {
      text-decoration: underline;
    }

    /* 顶部控制栏 */
    #admin-toolbar {
      position: fixed;
      top: 10px;
      right: 20px;
      z-index: 99999;
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e2e8f0;
      padding: 6px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      font-size: 13px;
      color: #334155;
    }
    .tool-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 0;
    }
    .tool-btn-change {
      color: #2563eb;
    }
    .tool-btn-logout {
      color: #ef4444;
      margin-left: 6px;
    }
  </style>

  <script>
    // ==========================================
    // 1. 用户白名单与密码体系
    // 管理员可以在下方直接新增/编辑允许登录的手机号或邮箱，以及初始密码
    // ==========================================
    const DEFAULT_ACCOUNTS = {
      "admin@fjwmkc.com": "admin888",
      "13800000000": "123456",
      "sales@fjwmkc.com": "123456"
    };

    // 初始化用户存储
    function initUserDatabase() {
      let db = localStorage.getItem("system_user_db");
      if (!db) {
        localStorage.setItem("system_user_db", JSON.stringify(DEFAULT_ACCOUNTS));
      }
    }
    initUserDatabase();

    function getUserDb() {
      try {
        return JSON.parse(localStorage.getItem("system_user_db")) || DEFAULT_ACCOUNTS;
      } catch (e) {
        return DEFAULT_ACCOUNTS;
      }
    }

    // 2. 检查会话状态
    window.addEventListener("DOMContentLoaded", () => {
      const activeUser = sessionStorage.getItem("active_login_user");
      if (activeUser) {
        unlockDashboard(activeUser);
      }
    });

    // 3. 执行登录操作
    function executeLogin() {
      const userInput = document.getElementById("auth-user").value.trim();
      const passInput = document.getElementById("auth-pass").value;

      if (!userInput || !passInput) {
        alert("请输入完整的用户名和密码！");
        return;
      }

      const db = getUserDb();
      if (!(userInput in db)) {
        alert("账号不存在！请使用配置的邮箱或手机号。");
        return;
      }

      if (db[userInput] !== passInput) {
        alert("登录密码错误，请重新输入！");
        return;
      }

      // 验证成功
      sessionStorage.setItem("active_login_user", userInput);
      unlockDashboard(userInput);
    }

    // 4. 自助修改密码（同事可随时自行修改自己的密码）
    function executeChangePassword() {
      const db = getUserDb();
      const targetUser = prompt("请输入您要修改密码的账号 (邮箱或手机号)：");
      if (!targetUser) return;

      if (!(targetUser in db)) {
        alert("未找到该账号，无法修改！");
        return;
      }

      const oldPass = prompt("请输入当前旧密码：");
      if (oldPass !== db[targetUser]) {
        alert("原密码验证错误，禁止修改！");
        return;
      }

      const newPass1 = prompt("请输入新的登录密码：");
      if (!newPass1 || newPass1.trim() === "") {
        alert("新密码不能为空！");
        return;
      }

      const newPass2 = prompt("请再次输入新密码确认：");
      if (newPass1 !== newPass2) {
        alert("两次输入的新密码不一致，修改失败！");
        return;
      }

      db[targetUser] = newPass1.trim();
      localStorage.setItem("system_user_db", JSON.stringify(db));
      alert("密码修改成功！下次登录请使用新密码。");
    }

    // 5. 退出登录
    function executeLogout() {
      if (confirm("确定要退出后台管理系统吗？")) {
        sessionStorage.removeItem("active_login_user");
        localStorage.removeItem("decap-cms-user");
        localStorage.removeItem("netlify-cms-user");
        window.location.reload();
      }
    }

    // 6. 解除登录遮罩并加载 CMS
    function unlockDashboard(username) {
      document.getElementById("login-overlay").style.display = "none";
      document.getElementById("admin-toolbar").style.display = "flex";
      document.getElementById("display-username").innerText = username;

      if (!window.CMS_BOOTSTRAPPED) {
        window.CMS_BOOTSTRAPPED = true;
        const script = document.createElement("script");
        script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
        document.body.appendChild(script);
      }
    }
  </script>
</head>
<body>

  <!-- 独立登录界面 -->
  <div id="login-overlay">
    <div class="auth-card">
      <h2>网站管理后台</h2>
      <p>请输入指定的邮箱或手机号码登录</p>

      <div class="form-group">
        <label>账号 (邮箱 / 手机号码)</label>
        <input type="text" id="auth-user" placeholder="如 13800000000 或 admin@fjwmkc.com" />
      </div>

      <div class="form-group">
        <label>登录密码</label>
        <input type="password" id="auth-pass" placeholder="输入密码" />
      </div>

      <button class="btn-login" onclick="executeLogin()">立即登录</button>

      <div class="sub-actions">
        <span>默认初始密码: 123456</span>
        <a onclick="executeChangePassword()">修改密码</a>
      </div>
    </div>
  </div>

  <!-- 顶部状态栏 -->
  <div id="admin-toolbar">
    <span>当前登录: <strong id="display-username"></strong></span>
    <span>|</span>
    <button class="tool-btn tool-btn-change" onclick="executeChangePassword()">🔑 修改密码</button>
    <button class="tool-btn tool-btn-logout" onclick="executeLogout()">🚪 退出</button>
  </div>

</body>
</html>
