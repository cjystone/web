<!-- 前端自动同步引擎：直接读取本地生成的 JSON 产品库，彻底解决 GitHub API 拦截问题 -->
  <script>
    (async function loadProductsLocal() {
      const container = document.getElementById("dynamic-products-grid");
      if (!container) return;

      try {
        // 直接读取网站自身的 JSON 文件，不经过外部 API
        const res = await fetch("/content/products.json?v=" + new Date().getTime());
        
        if (!res.ok) {
          showNotice("暂未检测到产品数据，请进入后台【网站产品库】添加。");
          return;
        }

        const data = await res.json();
        const products = data.items || [];

        if (products.length === 0) {
          showNotice("产品库为空，请点击右上角进入后台添加产品。");
          return;
        }

        let cardsHtml = "";

        products.forEach(item => {
          let image = item.image || "https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80";
          if (image.startsWith("./")) {
            image = image.replace("./", "/");
          }

          const title = item.title || "未命名产品";
          const model = item.model || "OEM/ODM";
          const priceMoq = item.price_moq || "";
          const specs = item.specs || "";

          cardsHtml += `
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
              <div class="h-56 bg-slate-100 flex items-center justify-center p-4 relative">
                <img src="${image}" alt="${title}" class="max-h-full max-w-full object-contain transition duration-300 hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80'">
                <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-[10px] font-bold text-slate-700 px-2 py-0.5 rounded shadow-sm border border-slate-200">
                  ${model}
                </span>
              </div>
              <div class="p-5 flex-1 flex flex-col justify-between">
                <div>
                  <h3 class="font-bold text-slate-900 text-base leading-snug mb-2 line-clamp-2" title="${title}">
                    ${title}
                  </h3>
                  <div class="text-xs font-bold text-brand-700 mb-2">
                    ${priceMoq}
                  </div>
                  ${specs ? `<p class="text-xs text-slate-500 leading-relaxed line-clamp-2 mb-4">${specs}</p>` : ''}
                </div>
                <a href="#contact" class="block w-full py-2 text-center bg-slate-900 hover:bg-brand-700 text-white rounded-lg text-xs font-bold transition">
                  立即询盘 (Inquire)
                </a>
              </div>
            </div>
          `;
        });

        container.innerHTML = cardsHtml;

      } catch (err) {
        console.error("加载产品出错", err);
        showNotice("产品数据读取异常，请确认后台是否已发布产品。");
      }

      function showNotice(msg) {
        if (container) {
          container.innerHTML = `
            <div class="col-span-full py-16 text-center">
              <p class="text-slate-400 text-sm mb-4">${msg}</p>
              <a href="/admin/" target="_blank" class="inline-flex px-4 py-2 bg-brand-700 text-white text-xs font-bold rounded-lg shadow-sm hover:bg-brand-800 transition">
                进入后台发品
              </a>
            </div>
          `;
        }
      }
    })();
  </script>
