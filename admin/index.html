<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外贸网站管理后台 - 成员登录</title>
  <style>
    /* 登录遮罩层 */
    #login-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-box {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
    }
    .login-box h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #0f172a;
      text-align: center;
    }
    .login-box p {
      margin: 0 0 24px 0;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: #1b4d3e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #143a2f; }
    .extra-links {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }
    .extra-links a {
      font-size: 12px;
      color: #2563eb;
      text-decoration: none;
      cursor: pointer;
    }

    /* 顶部登录状态与退出工具条 */
    #user-topbar {
      position: fixed;
      top: 10px;
      right: 20px;
      z-index: 99999;
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 13px;
      color: #334155;
    }
    .action-link {
      color: #2563eb;
      cursor: pointer;
      font-weight: 500;
      text-decoration: underline;
    }
    .action-logout {
      color: #ef4444;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- 独立账号登录弹窗 -->
  <div id="login-modal">
    <div class="login-box">
      <h2>网站管理后台</h2>
      <p>请输入分配的邮箱或手机号登录</p>
      
      <div class="input-group">
        <label>账号 (邮箱 / 手机号)</label>
        <input type="text" id="login-user" placeholder="name@company.com 或 138..." required />
      </div>

      <div class="input-group">
        <label>登录密码</label>
        <input type="password" id="login-pass" placeholder="输入密码" required />
      </div>

      <button class="btn-submit" onclick="handleLogin()">登 录</button>

      <div class="extra-links">
        <a onclick="handleSelfChangePassword()">修改我的密码</a>
      </div>
    </div>
  </div>

  <!-- 登录成功后的顶部状态条 -->
  <div id="user-topbar">
    <span>当前用户: <strong id="current-user-tag"></strong></span>
    <span class="action-link" onclick="handleSelfChangePassword()">修改密码</span>
    <span class="action-logout" onclick="handleLogout()">退出登录</span>
  </div>

  <script>
    const REPO_USER = "cjystone";
    const REPO_NAME = "web";

    // 页面初始化检查登录状态
    window.addEventListener("DOMContentLoaded", () => {
      const authUser = sessionStorage.getItem("current_login_account");
      if (authUser) {
        unlockDashboard(authUser);
      }
    });

    // 1. 登录验证逻辑
    async function handleLogin() {
      const uInput = document.getElementById("login-user").value.trim();
      const pInput = document.getElementById("login-pass").value;

      if (!uInput || !pInput) {
        alert("请输入完整的账号和密码！");
        return;
      }

      // 优先检查本地是否修改过该账号密码
      const localStoredPass = localStorage.getItem("user_pass_" + uInput);

      try {
        // 从 GitHub 仓库读取该用户数据
        const res = await fetch(`https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/content/staff/${encodeURIComponent(uInput)}.md`);
        
        if (!res.ok) {
          alert("账号不存在！请联系管理员在【后台账号管理】中创建您的邮箱或手机号。");
          return;
        }

        const rawContent = await res.text();
        
        // 提取初始密码配置
        let initialPass = "123456";
        const passMatch = rawContent.match(/password:\s*["']?(.*?)["']?\s*$/m);
        if (passMatch && passMatch[1]) {
          initialPass = passMatch[1].trim();
        }

        // 当前有效密码（修改过以修改后的为准，否则使用初始密码）
        const validPassword = localStoredPass || initialPass;

        if (pInput === validPassword) {
          sessionStorage.setItem("current_login_account", uInput);
          unlockDashboard(uInput);
        } else {
          alert("密码错误，请重新输入！");
        }
      } catch (err) {
        alert("网络连接异常，无法验证账号，请稍后重试！");
      }
    }

    // 2. 自助修改密码逻辑
    async function handleSelfChangePassword() {
      const uInput = prompt("请输入您的登录账号 (邮箱或手机号)：");
      if (!uInput) return;

      const oldPass = prompt("请输入原密码：");
      if (!oldPass) return;

      // 获取当前密码并验证
      const localStoredPass = localStorage.getItem("user_pass_" + uInput);
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/content/staff/${encodeURIComponent(uInput)}.md`);
        if (!res.ok) {
          alert("账号不存在！");
          return;
        }
        const rawContent = await res.text();
        let initialPass = "123456";
        const passMatch = rawContent.match(/password:\s*["']?(.*?)["']?\s*$/m);
        if (passMatch && passMatch[1]) initialPass = passMatch[1].trim();

        const validPassword = localStoredPass || initialPass;

        if (oldPass !== validPassword) {
          alert("原密码错误，修改中止！");
          return;
        }

        const newPass1 = prompt("请输入新密码：");
        if (!newPass1 || newPass1.trim() === "") {
          alert("新密码不能为空！");
          return;
        }
        const newPass2 = prompt("请再次确认新密码：");
        if (newPass1 !== newPass2) {
          alert("两次新密码输入不一致，修改失败！");
          return;
        }

        // 保存新密码
        localStorage.setItem("user_pass_" + uInput, newPass1.trim());
        alert("新密码设置成功！下次请使用新密码登录。");
      } catch (err) {
        alert("验证超时，请重试。");
      }
    }

    // 3. 登录成功解除遮罩并启动 Decap CMS
    function unlockDashboard(userAccount) {
      document.getElementById("login-modal").style.display = "none";
      document.getElementById("user-topbar").style.display = "flex";
      document.getElementById("current-user-tag").innerText = userAccount;

      // 仅在首次登录时挂载 CMS 程序
      if (!window.CMS_LOADED) {
        window.CMS_LOADED = true;
        const script = document.createElement("script");
        script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
        document.body.appendChild(script);
      }
    }

    // 4. 退出登录
    function handleLogout() {
      if (confirm("确定要退出当前账号吗？")) {
        sessionStorage.removeItem("current_login_account");
        localStorage.removeItem("decap-cms-user");
        localStorage.removeItem("netlify-cms-user");
        window.location.reload();
      }
    }
  </script>
</body>
</html>
